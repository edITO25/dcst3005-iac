name: nedriving av et miljø #Navnet på workflow 

on:
  workflow_dispatch: #Trigges manuellt med bekreftelse 
    inputs: 
      environment: 
        description: Miljø som skal rives ned 
        type: choice
        options: [dev,test]
        required: true 
  
      bekreftelse: 
        description: 'skriv "riv ned <miljø> for å bekrefte'
        type: string 
        required: true

      begrunnelse: #brukes for logging 
        description: Hvorfor river du ned? 
        type: string 
        required: true

permissions: 
  id-token: write #gir workflowen lov til å be om et OIDC-token fra GitHub 
  contents: read #lov til å lese repo-innholdet

concurrency: 
  group: nettverk-${{ inputs.environment }}  #én kjøring per miljø
  cancel-in-progress: false #en ny kjøring for samme miljø, mens en gammel pågår -> den nye havner i kø 


jobs: #2 jobber i denne workflowen 
  bekreft: #navnet på jobben 
    runs-on: ubuntu-latest #GitHub-runner med Ubuntu 

    steps: #Stegene til jobben 
      - name: Sjekk bekreftelsen 

        env: 
          BEKREFTELSE: ${{ inputs.bekreftelse }} #teksten brukeren skrev inn
          MILJO: ${{ inputs.environment }} #miljøet som skal rives ned
          BEGRUNNELSE: ${{ inputs.begrunnelse }} #begrunnelse for nedriving 
        run: |
          if [ "$BEKREFTELSE" != "riv ned $MILJO" ]; then 
            echo "::error::Ikke bekreftet. Forventet nøyaktig: riv ned $MILJO"
            exit 1 
          fi 
          echo "Bekreftet. Begrunnelse: $BEGRUNNELSE"
      #stopper jobben med feilstatus 

    riv-ned: #ny jobb 
      needs: bekreft #avhenger av jobben bekreft 
      runs-on: ubuntu-latest
      environment: ${{ inputs.environment }} #gir tilgang til environment-spesifikke secrets

      defaults:   
        run: 
          working-directory: oving5/oppgave-5/stacks/nettverk #Alle run-steg i denne jobben kjøres fra stacks/nettverk 

      env: #Miljøvariabler for jobben 
        MILJO: ${{ input.environment}} #miljøet som skal rives ned 
        ARM_USE_OIDC: true
        ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID}}
        ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
        ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
        TF_INPUT: false #Terraform feiler i stedet for å bli stående og vente på input, hvis noe mangler 
        TF_IN_AUTOMATION: true #justerer Terraform output for automatisert kjøring 

      steps: 
        - name: Hent kode 
          uses: actions/checkout

        - name: Installer Terraform 
          uses: Hashicorp/setup-terraform@v3
          with: 
            terraform_wrapper: false 

        - name: Logg inn i Azure 
          uses: azure/login@v2
          with: 
            client-id: ${{ secrets.AZURE_CLIENT_ID}}
            tenant-id: ${{ secrets.ARM_TENANT_ID }}
            subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

        - name: Hent parameterfila fra Key Vault  #tfvars-filen 
          run: | 
            az keyvault secret show \
              --vault-name "${{ secrets.KEYVAULT_NAME }}" \
              --name "tfvars-$MILJO" \
              --query value -o tsv > params.auto.tfvars

        - name: Init  #backend konfigurasjoner 
          run: |
            terraform init \
              -backend-config="${{ github.workspace }}/oving5/oppgave-5/shared/backend.hcl" \
              -backend-config="key=env/$MILJO/nettverk.tfstate"
  
        - name: Lag en destroy-plan
          run: terraform plan -destroy -out=tfdestroy

        - name: utfør destroy-planen 
          run: terraform apply tfdestroy

        - name: vertifiser at det er tomt 
          run: terraform state list 

        - name: Slett parameterfila 
          if: always()
          run: rm -f params.auto.tfvars
        

      
