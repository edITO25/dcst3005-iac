#Del c,d og e - utrullingen mot ett miljø, skrevet én gang 

name: utrulling mot ett miljø 

on: 
  workflow_call: 
    inputs:  #Det er to environment_inputs 
      miljo:
        description: Miljøet som skal rulles ut 
        required: true
        type: string
      plan_miljo: 
        description: GitHub-environment plan-jobben kjører uinder 
        required: true
        type: string 


permissions:
  id-token: write  #workflowen må kunne be om OIDC-token 
  contents: read #workflowen må kunne lese innholdet i repoet 


jobs: 
  plan: #navnet på jobben 
    #denne jobben tar i bruk plan_miljo 
    runs-on: ubuntu-latest
    environment: ${{ inputs.plan_miljo }}


    defaults: 
      run: 
        working-directory: oving6/stacks/nettverk  #Alle run-steg kjører her

    env: 
      MILJO: ${{ inputs.miljo }}
      ARM_USE_OIDC: true
      #secrets
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      TF_INPUT: false #Terraform feiler i stedet for å bli stående og vente på input, hvis noe mangler 
      TF_IN_AUTOMATION: true #justerer Terraform output for automatisert kjøring 

    steps: 
      - name: Hent koden 
        uses: actions/checkout@v5

      - name: Installer Terraform 
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false 

      - name: logg inn i Azure 
        uses: azure/login@v3.1.0
        with: 
          # secrets
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Hent parameterfila fra Key Vault 
        run: | 
          az keyvault secret show \
          --vault-name "${{ secrets.KEYVAULT_NAME }}" \
          --name "tfvars-${{ inputs.miljo }}" \
          --query value -o tsv > params.auto.tfvars

      - name: Init 
        run: |
          terraform init \
            -backend-config="${{ github.workspace }}/oving6/shared/backend.hcl" \
            -backend-config="key=env/${{ inputs.miljo }}/nettverk.tfstate"

      - name: Validate
        run: terraform validate 

      - name: Plan 
        run: terraform plan -out=tfplan 

      - name: ta vare på planen 
        uses: actions/upload-artifact@v7
        with: 
          name: tfplan-${{ inputs.miljo }}-${{ github.sha }}  #lagrer planen under dette navnet, MERK! pathen filen lagres i 
          path: oving6/stacks/nettverk/tfplan
          retention-days: 5

      - name: Slett parameterfila
        if: always()
        run: rm -f params.auto.tfvars

# vi kan ikke ha apply og plan i samme job fordi vi trenger et tidspunkt å sette en godkjenning på 
#navnet på ny mjobb
  apply: 
    needs: plan #jobben er avhengig av plan-jobben 
    runs-on: ubuntu-latest
    environment: ${{ inputs.miljo }}  #denne jobben er avhengig av miljo

    defaults: 
      run: 
        working-directory: oving6/stacks/nettverk

    env: 
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_INPUT: false  #feiler istedenfor å vente på inout hvis noe mangler 
      TF_IN_AUTOMATION: true

    steps:  
      - name: Hent koden 
        uses: actions/checkout@v5

      - name: Installer Terraform 
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false 

      - name: logg inn i Azure 
        uses: azure/login@v3.1.0
        with: 
          # secrets
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      
      - name: Hent planen 
        uses: actions/download-artifact@v8
        with: 
          name: tfplan-${{ inputs.miljo }}-${{ github.sha }}  #planen som ble lagret 
          path: oving6/stacks/nettverk  #henter den i pathen den ble lagret i 


      - name: Init
        run: |
          terraform init \
            -backend-config="${{ github.workspace }}/oving6/shared/backend.hcl" \
            -backend-config="key=env/${{ inputs.miljo }}/nettverk.tfstate"


      - name: Apply
        run: terraform apply tfplan 

      - name: Vertifisere at nettverket finnes i Azure 
        run: |
          RG=$(terraform output -raw resource_group_name)
          VNET=$(terraform output -raw vnet_name)
          STATE=$(az network vnet show --resource-group "$RG" --name "$VNET" \
                    --query provisioningState -o tsv)
          echo "$VNET i $RG: $STATE"
          test "$STATE" = "Succeeded"



