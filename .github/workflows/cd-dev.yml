#navnet på workflowen 
name: Cd dev 
# test
#ruller ut nettverks-stacken til dev automatisk med pucj
#ruller ut nettverks-stacken til test bar når det velges manuellt 
#ikke et eneste storage account-navn, en eneste parameterverdi eller passord i fila 
 
run-name: dev ← ${{ github.sha }}
on: 
  push:
    branches: [main]  #automatisk ved push til main 
    paths: #dersom endringer treffer destinasjoner definert i paths
      - 'oving7/terraform-projects/stacks/nettverk/**'
      - 'oving7/terraform-projects/modules/network/**'
      - 'oving7/terraform-projects/shared/backend.hcl'
      - '.github/workflows/deploy-nettverk.yml'
      - '.github/workflows/cd-dev.yml'
permissions:
  id-token: write #gir workflowen lov til å be GitHub om en OIDC-token
  #brukes av azure/login og terraform -provideren til å autentisere mot Azure uten passord/hemmelige nøkler 
  contents: read #lov til å lese innholdet i repoet 
 
concurrency:  
  group: nettverk-dev
  cancel-in-progress: false  #pågående kjøring får fullføre i stedet for å bli avbrutt av en ny 
 
jobs:  
  rull-ut:
    runs-on: ubuntu-latest
    environment: dev
 
    defaults:
      run:
        working-directory: oving7/terraform-projects/stacks/nettverk
    env:
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_INPUT: false
      TF_IN_AUTOMATION: true
 
    steps:
      - name: Hent koden
        uses: actions/checkout@v5
 
      - name: Installer Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
 
      - name: Logg inn i Azure
        uses: Azure/login@v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
 
      - name: Hent parameterfila for dev
        run: |
          az keyvault secret show \
            --vault-name "${{ secrets.KEYVAULT_NAME }}" \
            --name "tfvars-dev" \
            --query value -o tsv > params.auto.tfvars
 
      - name: Init
        run: |
          terraform init \
            -backend-config="${{ github.workspace }}/oving7/terraform-projects/shared/backend.hcl" \
            -backend-config="key=env/dev/nettverk.tfstate"
        # Planen lagres i en fil ...
      - name: Plan
        run: terraform plan -out=tfplan
 
      # ... og apply kjører akkurat den fila. Ingen -auto-approve: Terraform
      # spør bare «er du sikker?» når den selv må lage en ny plan.
      - name: Apply
        run: terraform apply tfplan
 
      - name: Slett parameterfila
        if: always()
        run: rm -f params.auto.tfvars
 
      # Det du trenger til neste steg, på kjøringens forside.
      - name: Skriv oppsummering
        run: |
          {
            echo "## ✅ Dev er oppdatert"
            echo
            echo "Rullet ut commit:"
            echo
            echo '```'
            echo "${{ github.sha }}"
            echo '```'
            echo
            echo "**Neste steg:** Actions → *CD test* → *Run workflow* → lim inn SHA-en over."
          } >> "$GITHUB_STEP_SUMMARY"
 
  
  
    
    
